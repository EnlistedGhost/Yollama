name: Build and Release Yollama

on:
  push:
    branches: [ master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: 1
      MAKEFLAGS: "-j10 -fno-aggressive-loop-optimizations"
      GOMAXPROCS: 8

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    # 1. Fetch pre-compiled dynamic llama.cpp backend assets from asset release
    - name: Download Llama.cpp Runtimes from Release
      uses: robinraju/release-downloader@v1
      with:
        repository: "EnlistedGhost/Yollama"
        tag: "b9840_amd64_linux"
        fileName: "yollama-b9840-lib.tar.gz"
        out-file-path: "lib"

    # 2. Extract backend assets into 'lib' directory
    - name: Unpack Backend Assets
      run: |
        mkdir -p lib
        cd lib
        tar -xzf yollama-b9840-lib.tar.gz || true
        rm -f yollama-b9840-lib.tar.gz
        cd ../

    - name: Set up Go 1.26.x Toolchain
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Execute Build Sequence
      run: |
        go clean -cache
        go generate ./...
        go build -v -trimpath -o yollama .

    # 3. Package binary, 'lib' folder, and interactive setup_yollama.sh script
    - name: Package Full Bundle into Tarball
      run: |
        mkdir -p dist
        mkdir -p package
        mkdir -p package/lib
        cp yollama package/
        cp setup_yollama.sh package/
        cp -P lib/*.so* package/lib/ || true
        cp lib/llama-server package/lib/ || true
        cp lib/llama-quantize package/lib/ || true
        tar -czf yollama-linux-amd64.tar.gz package/
        mv yollama-linux-amd64.tar.gz dist/yollama-linux-amd64.tar.gz

    - name: Upload Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yollama-full-bundle
        path: dist/yollama-linux-amd64.tar.gz

    - name: Publish GitHub Release on Tag Push
      uses: softprops/action-gh-release@v3
      if: startsWith(github.ref, 'refs/tags/v')
      with:
        files: dist/yollama-linux-amd64.tar.gz
        generate_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
