name: Build and Release Yollama

on:
  push:
    branches: [ master ]
    tags:
      - 'v*.*.*'
  pull_request:
    branches: [ master ]

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    env:
      GOOS: linux
      GOARCH: amd64
      CGO_ENABLED: 1
      MAKEFLAGS: "-j10 -fno-aggressive-loop-optimizations"
      GOMAXPROCS: 8

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0  # Required to commit, tag, and push version updates properly

    # 1. Automatically increment the build suffix inside version/version.go on master pushes
    - name: Increment Version in version.go (Master Push Only)
      id: bump_version
      if: github.event_name == 'push' && github.ref == 'refs/heads/master'
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        
        CURRENT_LINE=$(grep -E 'var\s+Version\s+string\s*=\s*".*"' version/version.go)
        RAW_VER=$(echo "$CURRENT_LINE" | sed -E 's/.*"(.*)"/\1/')
        
        # Extracts everything up to the 'xc' (e.g., "0.33.0-xc")
        PREFIX=$(echo "$RAW_VER" | sed -E 's/(.*xc)[0-9]+$/\1/')
        
        # Extracts just the trailing number after 'xc' (e.g., "11")
        BUILD_NUM=$(echo "$RAW_VER" | sed -E 's/.*xc([0-9]+)$/\1/')
        
        # Increments the trailing build number
        NEW_BUILD=$((BUILD_NUM + 1))
        NEW_RAW_VER="${PREFIX}${NEW_BUILD}"
        NEW_TAG="v${NEW_RAW_VER}"
        
        echo "Bumping version from $RAW_VER to $NEW_RAW_VER"
        sed -i 's/var Version string = "'"$RAW_VER"'"/var Version string = "'"$NEW_RAW_VER"'"/' version/version.go
        
        git add version/version.go
        git commit -m "chore(version): auto-bump version to $NEW_RAW_VER [skip ci]" || echo "No changes"
        git push origin master || echo "Push skipped"
        
        echo "NEW_TAG=$NEW_TAG" >> $GITHUB_OUTPUT

    - name: Fetch pre-compiled dynamic llama.cpp backend assets from asset release
      uses: robinraju/release-downloader@v1
      with:
        repository: "EnlistedGhost/Yollama"
        tag: "llama_cpp_libs"
        fileName: "llama_cpp-b10444_rr.tar.gz"
        out-file-path: "lib"

    - name: Unpack Backend Assets
      run: |
        mkdir -p lib
        cd lib
        tar -xzf llama_cpp-b10444_rr.tar.gz || true
        rm -f llama_cpp-b10444_rr.tar.gz
        cd ../

    - name: Set up Go 1.26.x Toolchain
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache: true

    - name: Execute Build Sequence
      run: |
        go clean -cache
        go generate ./...
        go build -v -trimpath -o yollama .

    - name: Package Full Bundle into Tarball
      run: |
        mkdir -p dist
        mkdir -p package
        mkdir -p package/lib
        cp yollama package/
        cp setup_yollama.sh package/
        cp -P lib/*.so* package/lib/ || true
        cp lib/llama-server package/lib/ || true
        cp lib/llama-quantize package/lib/ || true
        tar -czf yollama-linux-amd64.tar.gz package/
        mv yollama-linux-amd64.tar.gz dist/yollama-linux-amd64.tar.gz

    - name: Upload Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: yollama-full-bundle
        path: dist/yollama-linux-amd64.tar.gz

    - name: Create and Push Git Tag Automatically
      run: |
        TAG="${{ steps.bump_version.outputs.NEW_TAG }}"
        if [ -n "$TAG" ]; then
          git tag -a "$TAG" -m "Automated release tag for $TAG"
          git push origin "$TAG" || echo "Tag already exists"
        fi

    - name: Publish GitHub Release on Tag Push
      uses: softprops/action-gh-release@v3
      if: steps.bump_version.outputs.NEW_TAG != '' || startsWith(github.ref, 'refs/tags/v')
      with:
        tag_name: ${{ steps.bump_version.outputs.NEW_TAG || github.ref_name }}
        files: dist/yollama-linux-amd64.tar.gz
        generate_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
